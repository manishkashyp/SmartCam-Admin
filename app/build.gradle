plugins {
    id 'com.android.application'
}

android {
    namespace 'in.luxture.smartcamadmin'
    compileSdk 34

    defaultConfig {
        applicationId "in.luxture.smartcamadmin"
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName "3.0-Official-OAuth"
    }

    signingConfigs {
        smartcamFixedKey {
            storeFile file("smartcam_release.keystore")
            storePassword "smartcam2026"
            keyAlias "smartcam_key"
            keyPassword "smartcam2026"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.smartcamFixedKey
            debuggable true
        }
        release {
            signingConfig signingConfigs.smartcamFixedKey
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'com.google.android.gms:play-services-auth:20.7.0'
}
